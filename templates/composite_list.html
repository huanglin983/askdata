{% extends "base.html" %}
{% block title %}复合指标{% endblock %}
{% block content %}
<div class="card">
  <div class="actions" style="justify-content:space-between">
    <h1 style="margin:0">复合指标</h1>
    <a class="btn" href="{{ url_for('composite_edit') }}">新增</a>
  </div>
  <p class="muted">不写 SQL，只配置公式 + 子指标；可单独绑定分析维度（问数交叉校验取交集）。</p>
  <table>
    <thead>
      <tr><th>名称</th><th>公式</th><th>子指标</th><th>绑定维度</th><th></th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.name }} <span class="badge">{{ r.id }}</span></td>
        <td><code>{{ r.formula }}</code></td>
        <td><code>{{ r.subs | join(', ') }}</code></td>
        <td class="muted">{{ r.dim_labels }}</td>
        <td class="actions">
          <a href="{{ url_for('composite_edit', metric_id=r.id) }}">编辑</a>
          <form method="post" action="{{ url_for('composite_delete', metric_id=r.id) }}" onsubmit="return confirm('删除？');">
            <button type="submit" class="danger">删</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5">暂无数据</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
