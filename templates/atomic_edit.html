{% extends "base.html" %}
{% block title %}编辑原子指标{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ '编辑' if row else '新增' }}原子指标</h1>
  <form method="post">
    {% if row %}<input type="hidden" name="id" value="{{ row.id }}">{% endif %}
    <label>名称</label>
    <input type="text" name="name" required value="{{ row.name if row else '' }}">
    <label>来源表</label>
    <input type="text" name="source_table" required value="{{ row.source_table if row else 'ads_fin_tracker_comparison_summary_df' }}">
    <label>来源字段</label>
    <input type="text" name="source_field" required value="{{ row.source_field if row else '' }}">
    <label>聚合</label>
    <select name="agg_type">
      {% set agg = row.agg_type if row else 'SUM' %}
      <option value="SUM" {% if agg=='SUM' %}selected{% endif %}>SUM</option>
      <option value="MAX" {% if agg=='MAX' %}selected{% endif %}>MAX</option>
      <option value="MIN" {% if agg=='MIN' %}selected{% endif %}>MIN</option>
    </select>
    {% include "_dim_bind.html" %}
    <label>备注</label>
    <input type="text" name="remark" value="{{ row.remark if row else '' }}">
    <p class="actions" style="margin-top:1rem">
      <button type="submit">保存</button>
      <a class="btn secondary" href="{{ url_for('atomic_list') }}">返回</a>
    </p>
  </form>
</div>
{% endblock %}
