{# Shared identity cell for metric list tables (name / key / alias tags). #}
{% macro metric_identity(name, key, aliases=None) -%}
<td class="metric-identity"{% if name or key %} title="{{ name }}{% if key %} · {{ key }}{% endif %}"{% endif %}>
  <div class="metric-identity-name">{{ name or '—' }}</div>
  {% if key %}<div class="metric-identity-key">{{ key }}</div>{% endif %}
  {% if aliases %}
  <div class="metric-identity-aliases">
    <span class="metric-identity-aliases-label">别名:</span>
    {% for a in aliases %}
    <span class="alias-tag">{{ a }}</span>
    {% endfor %}
  </div>
  {% endif %}
</td>
{%- endmacro %}
