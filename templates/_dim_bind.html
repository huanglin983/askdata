{# 指标编辑页复用：绑定分析维度（来自元数据字段） #}
<label>绑定分析维度 <span class="muted">（至少含一个粒度字段；来自元数据中勾选「用于分析维度」的字段）</span></label>
<div class="checks">
  {% for d in dims %}
  <label>
    <input type="checkbox" name="dim_ids" value="{{ d.id }}"
      {% if d.id in selected_dims %}checked{% endif %}>
    {{ d.name }}
    <span class="badge">{{ '粒度' if d.dim_role=='grain' else '分析' }}</span>
    <span class="muted">{{ 'fact' if d.origin=='fact' else 'dim' }} · {{ d.table_name }}</span>
    <code>{{ d.code }}</code>
  </label>
  {% else %}
  <span class="muted">请先在「元数据」中注册表字段，并勾选「用于分析维度」</span>
  {% endfor %}
</div>
